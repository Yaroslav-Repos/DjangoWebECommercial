{% extends "app/layout.html" %}

{% block content %}
<h2>Your cart</h2>
{% if items %}
    <table class="table">
        <tr><th>Product</th><th>Qty</th><th>Price</th></tr>
        {% for it in items %}
            <tr>
                <td>{{ it.product.name }}</td>
                <td>{{ it.quantity }}</td>
                <td>{{ it.product.price }}</td>
            </tr>
        {% endfor %}
    </table>
    <a class="btn btn-success" href="{% url 'checkout' %}">Checkout</a>
{% else %}
    <p>Your cart is empty.</p>
{% endif %}
{% endblock %}
