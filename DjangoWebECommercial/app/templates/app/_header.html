<header class="site-header">
    <div class="container header-inner">
    <div class="brand">Rozetka-style Shop</div>
    <nav class="main-nav">
      <button class="catalog-toggle">Каталог</button>
      <div class="search-wrap">
        <form method="get" action="{% url 'search' %}">
          <input name="q" placeholder="Пошук товарів..." value="{{ request.GET.q }}"/>
        </form>
      </div>
      <a href="{% url 'cart' %}" class="cart-link">Кошик</a>
    </nav>
  </div>
  <div class="catalog-drawer">
    <ul class="catalog-tree">
      {% for c in site_categories %}
        <li data-subcategories-url="{% url 'ajax_subcategories' c.slug %}">
          <a href="{% url 'category' c.slug %}" data-menu-category>{{ c.name }}</a>
          <ul class="submenu" hidden></ul>
        </li>
      {% endfor %}
    </ul>
  </div>
</header>
