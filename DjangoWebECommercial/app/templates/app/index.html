{% extends "app/layout.html" %}

{% block content %}
  {% load shop_tags %}
  <div class="breadcrumb-row">
    <!-- placeholder for search tree -->
  </div>
  <div class="container grid">
    <aside>
      <h4>Категорії</h4>
      <ul>
        {% for c in categories %}
          <li><a href="{% url 'category' c.slug %}">{{ c.name }}</a></li>
        {% endfor %}
      </ul>
    </aside>
    <main>
      <h2>Top products</h2>
      <div class="products-grid">
        {% for p in top_products %}
          <div class="product-card">
            <div class="product-image">
              {% if p.image %}<img src="{{ p.image.url }}" style="max-width:100%;max-height:100%"/>{% endif %}
            </div>
            <div class="product-info">
              <a href="{% url 'product' p.slug %}"><strong>{{ p.name }}</strong></a>
              <div>{{ p.price }} USD</div>
            </div>
          </div>
        {% endfor %}
      </div>
    </main>
  </div>
{% endblock %}
